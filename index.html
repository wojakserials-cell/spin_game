<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; overflow: hidden; background: #fff; }

    /* ЭКРАН 1: ГЛАВНАЯ */
    #start-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #2b1a3e 0%, #4a2a6a 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; transition: opacity 0.3s;
    }
    .start-title { font-size: 32px; font-weight: bold; margin-bottom: 40px; text-shadow: 0 0 15px rgba(255,255,255,0.4); }
    .crash-btn-main {
      padding: 20px 40px; font-size: 24px; font-weight: bold;
      background: #fff; color: #2b1a3e; border: none; border-radius: 50px;
      cursor: pointer; box-shadow: 0 0 25px rgba(255,255,255,0.4);
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .crash-btn-main:hover { transform: scale(1.05); box-shadow: 0 0 40px rgba(255,255,255,0.6); }

    /* ЭКРАН 2: ИГРА */
    #game-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #fff; display: none; flex-direction: column; align-items: center; justify-content: center;
    }
    #game {
      position: relative; width: 320px; height: 480px;
      border: 2px solid #ddd; background: #fff; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    }

    /* История полётов */
    #history-container {
      width: 100%; padding: 10px; background: #f8f9fa; border-bottom: 1px solid #eee;
      max-height: 120px; overflow-y: auto; font-size: 14px; color: #555;
    }
    .history-item { margin: 4px 0; padding: 6px 10px; background: #fff; border-radius: 6px; border-left: 4px solid #007bff; }
    
    .btn {
      padding: 12px 24px; font-size: 16px; cursor: pointer; border: none; margin-top: 8px;
      border-radius: 8px; transition: transform 0.05s;
    }
    .btn:active { transform: scale(0.96); }
    #bet-btn { background: #333; color: white; }
    #cashout-btn { background: #28a745; color: white; display: none; }

    #status { text-align: center; margin-bottom: 10px; font-weight: bold; color: #333; }
    
    /* Блок с множителем и выигрышем */
    #multiplier-block {
      font-size: 42px; color: #007bff; font-weight: bold; margin-bottom: 15px;
      text-align: center; min-height: 60px;
    }
    .win-message {
      color: #28a745 !important; font-size: 36px !important;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }

    #bet-input {
      width: 100%; padding: 12px; margin-top: 10px; border: 1px solid #ccc; border-radius: 8px;
      font-size: 16px; box-sizing: border-box; text-align: right;
    }

    /* Смайлик денег с крыльями */
    .money-plane {
      position: absolute; left: 140px; bottom: 10px; width: 40px; height: 40px;
      background: radial-gradient(circle at 20px 20px, #ffd700 0%, #d4af37 100%);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
      display: flex; align-items: center; justify-content: center;
      color: #2c1e3e; font-size: 22px; font-weight: bold;
    }
    .money-plane::before, .money-plane::after {
      content: ""; position: absolute;
      width: 30px; height: 20px;
      background: rgba(255,255,255,0.7); border-radius: 15px;
      filter: drop-shadow(0 0 5px rgba(255,255,255,0.8));
      transform-origin: center bottom;
    }
    .money-plane::before { left: -18px; transform: rotate(-30deg); }
    .money-plane::after { right: -18px; transform: rotate(30deg); }

    .explosion {
      position: absolute; width: 60px; height: 60px; border-radius: 50%;
      pointer-events: none; animation: pop 0.4s forwards;
    }
    @keyframes pop {
      0% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%,-50%) scale(2.5); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- ЭКРАН 1 -->
  <div id="start-screen">
    <div class="start-title">Spin Game</div>
    <button id="enter-btn" class="crash-btn-main">Краш</button>
  </div>

  <!-- ЭКРАН 2 -->
  <div id="game-screen">
    <!-- История полётов -->
    <div id="history-container">
      <strong>История полётов:</strong>
      <div id="history-list"></div>
    </div>

    <div id="game">
      <div id="status">Баланс: <span id="balance">1000</span> ₽</div>
      
      <!-- Сюда выводится множитель и надпись WIN -->
      <div id="multiplier-block">x1.00</div>
      
      <input type="number" id="bet-input" placeholder="Ставка (макс. 2000)" min="1" max="2000">
      
      <button id="bet-btn" class="btn">Принять ставку</button>
      <button id="cashout-btn" class="btn">Забрать</button>
      
      <div class="money-plane" id="plane">$</div>
    </div>
  </div>

  <script>
    const startScreen = document.getElementById('start-screen');
    const gameScreen = document.getElementById('game-screen');
    const enterBtn = document.getElementById('enter-btn');

    const balanceEl = document.getElementById('balance');
    const multBlock = document.getElementById('multiplier-block');
    const betInput = document.getElementById('bet-input');
    const plane = document.getElementById('plane');
    const betBtn = document.getElementById('bet-btn');
    const cashoutBtn = document.getElementById('cashout-btn');
    const historyList = document.getElementById('history-list');

    let balance = 1000;
    let bet = 0;
    let multiplier = 1.0;
    let isRunning = false;
    
    // Скорость движения (px за кадр)
    let speed = 2;
    const speedBoost = 1.10; // +10% при переходе через целое число
    
    let planePos = 10;
    let frameId;

    enterBtn.onclick = () => {
      startScreen.style.display = 'none';
      gameScreen.style.display = 'flex';
    };

    function startGame() {
      if (!isRunning && bet > 0) {
        isRunning = true;
        planePos = 10;
        multiplier = 1.0;
        speed = 2; // Сброс скорости для нового раунда
        multBlock.textContent = 'x' + multiplier.toFixed(1);
        multBlock.className = ''; // убираем класс win
        cashoutBtn.style.display = 'block';
        betBtn.style.display = 'none';
        betInput.disabled = true;
        animatePlane();
      }
    }

    function animatePlane() {
      // Движение самолёта
      planePos += speed;
      plane.style.bottom = planePos + 'px';

      // Плавный рост множителя: шаг 0.1
      multiplier += 0.0033; 
      multBlock.textContent = 'x' + multiplier.toFixed(1);

      const currentWhole = Math.floor(multiplier);
      const prevWhole = Math.floor(multiplier - 0.0033);

      // Если мы перешли через целое число (например, было 1.9, стало 2.0)
      if (currentWhole > prevWhole && currentWhole >= 2) {
        // Ускоряем самолёт на 10%
        speed *= speedBoost;
      }

      // --- ГЛАВНОЕ ИЗМЕНЕНИЕ: КРАШ В ЛЮБОЙ МОМЕНТ ---
      // Шанс 10% проверяется КАЖДЫЙ кадр (каждую долю секунды)
      const chance = Math.random();
      if (chance < 0.10) { // 10% шанс разбиться прямо сейчас
        stopGame(true);
        return;
      }
      // ----------------------------------------------

      // Если долетел до верха — победа (автоматический кэш-аут)
      if (planePos >= 450) {
        stopGame(false, true); // второй параметр: авто-победа
        return;
      }

      frameId = requestAnimationFrame(animatePlane);
    }

    function stopGame(crashed, autoWin = false) {
      cancelAnimationFrame(frameId);
      isRunning = false;
      cashoutBtn.style.display = 'none';
      betBtn.style.display = 'block';
      betInput.disabled = false;
      betInput.value = '';

      const finalMult = multiplier.toFixed(1);
      const displayMult = parseFloat(finalMult);

      if (crashed) {
        balance -= bet;
        balanceEl.textContent = balance.toFixed(0);
        createExplosion(plane.offsetLeft + 20, plane.offsetTop + 20);
        plane.style.bottom = '10px';
        addToHistory('Краш на x' + finalMult);
      } else {
        const winAmount = bet * displayMult;
        balance += winAmount;
        balanceEl.textContent = balance.toFixed(0);
        
        // Показываем WIN!!!
        multBlock.innerHTML = `x${finalMult}<br><span class="win-message">WIN!!!</span>`;
        
        plane.style.bottom = '10px'; // возвращаем вниз
        addToHistory(autoWin ? 'Долетел: x' + finalMult : 'Кэш-аут: x' + finalMult);
      }
      bet = 0;
    }

    function addToHistory(text) {
      const item = document.createElement('div');
      item.className = 'history-item';
      item.textContent = text;
      historyList.prepend(item);
      while (historyList.children.length > 10) {
        historyList.lastChild.remove();
      }
    }

    function createExplosion(x, y) {
      const el = document.createElement('div');
      el.className = 'explosion';
      el.style.background = 'radial-gradient(circle, #ff0000 0%, #ffaa00 20%, transparent 50%)';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      document.getElementById('game').appendChild(el);
      setTimeout(() => el.remove(), 400);
    }

    betBtn.onclick = () => {
      const inputValue = parseFloat(betInput.value);
      if (!inputValue || inputValue <= 0) {
        alert('Введите сумму ставки');
        return;
      }
      if (inputValue > 2000) {
        alert('Максимальная ставка — 2000 ₽');
        return;
      }
      if (balance >= inputValue) {
        bet = inputValue;
        balance -= bet;
        balanceEl.textContent = balance.toFixed(0);
        startGame();
      } else {
        alert('Недостаточно средств');
      }
    };

    cashoutBtn.onclick = () => {
      if (isRunning) {
        stopGame(false);
      }
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Money Crash Hard</title>
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; overflow: hidden; background: #fff; }
    
    /* ЭКРАН 1 */
    #start-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #2b1a3e 0%, #4a2a6a 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff;
    }
    .start-title { font-size: 32px; font-weight: bold; margin-bottom: 40px; text-shadow: 0 0 15px rgba(255,255,255,0.4); }
    .crash-btn-main { padding: 20px 40px; font-size: 24px; font-weight: bold; background: #fff; color: #2b1a3e; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 0 25px rgba(255,255,255,0.4); transition: transform 0.1s; }
    .crash-btn-main:hover { transform: scale(1.05); }

    /* ЭКРАН 2 */
    #game-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: none; flex-direction: column; align-items: center; justify-content: center; }
    #game { position: relative; width: 320px; height: 480px; border: 2px solid #ddd; background: #fff; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.15); }
    
    /* История */
    #history-container { width: 100%; padding: 10px; background: #f8f9fa; border-bottom: 1px solid #eee; max-height: 120px; overflow-y: auto; font-size: 14px; color: #555; }
    .history-item { margin: 4px 0; padding: 6px 10px; background: #fff; border-radius: 6px; border-left: 4px solid #007bff; }
    
    .btn { padding: 12px 24px; font-size: 16px; cursor: pointer; border: none; margin-top: 8px; border-radius: 8px; }
    #bet-btn { background: #333; color: white; }
    #cashout-btn { background: #28a745; color: white; display: none; }

    #status { text-align: center; margin-bottom: 10px; font-weight: bold; color: #333; }
    
    #multiplier-block {
      font-size: 42px; color: #007bff; font-weight: bold; margin-bottom: 15px;
      text-align: center; min-height: 60px;
    }
    .win-message { color: #28a745 !important; font-size: 36px !important; animation: pulse 1s infinite alternate; }
    @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }

    #bet-input { width: 100%; padding: 12px; margin-top: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; text-align: right; }

    /* Самолёт */
    .money-plane {
      position: absolute; left: 140px; bottom: 10px; width: 40px; height: 40px;
      background: radial-gradient(circle at 20px 20px, #ffd700 0%, #d4af37 100%);
      border-radius: 50%; box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
      display: flex; align-items: center; justify-content: center; color: #2c1e3e; font-size: 22px; font-weight: bold;
    }
    .money-plane::before, .money-plane::after {
      content: ""; position: absolute; width: 30px; height: 20px;
      background: rgba(255,255,255,0.7); border-radius: 15px;
      filter: drop-shadow(0 0 5px rgba(255,255,255,0.8));
      transform-origin: center bottom;
    }
    .money-plane::before { left: -18px; transform: rotate(-30deg); }
    .money-plane::after { right: -18px; transform: rotate(30deg); }

    .explosion {
      position: absolute; width: 60px; height: 60px; border-radius: 50%;
      pointer-events: none; animation: pop 0.4s forwards;
    }
    @keyframes pop { 0% { transform: translate(-50%,-50%) scale(1); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(2.5); opacity: 0; } }
  </style>
</head>
<body>

  <!-- ЭКРАН 1 -->
  <div id="start-screen">
    <div class="start-title">Spin Game</div>
    <button id="enter-btn" class="crash-btn-main">Краш</button>
  </div>

  <!-- ЭКРАН 2 -->
  <div id="game-screen">
    <div id="history-container">
      <strong>История полётов:</strong>
      <div id="history-list"></div>
    </div>
    <div id="game">
      <div id="status">Баланс: <span id="balance">1000</span> ₽</div>
      <div id="multiplier-block">x1.00</div>
      <input type="number" id="bet-input" placeholder="Ставка (макс. 2000)" min="1" max="2000">
      <button id="bet-btn" class="btn">Принять ставку</button>
      <button id="cashout-btn" class="btn">Забрать</button>
      <div class="money-plane" id="plane">$</div>
    </div>
  </div>

  <script>
    // --- НАСТРОЙКИ БАЛАНСА ---
    const BALANCE_START = 1000;
    const MAX_BET = 2000;
    
    // ГЛАВНАЯ ФИШКА: Математика против фарма на 1.5
    // Формула: Шанс = 0.08 + (Множитель * 0.06)
    // На x1.0 шанс ~8%. На x1.5

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rodeo Crash - Simple</title>
  <style>
    /* Базовые настройки */
    body {
      margin: 0;
      padding: 0;
      background-color: #2b2b2b;
      font-family: 'Courier New', Courier, monospace; /* Шрифт как в старых играх */
      color: white;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* Игровая панель */
    .game-container {
      width: 400px;
      height: 500px;
      border: 4px solid #555;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      position: relative;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Верхняя панель (баланс и ставка) */
    .top-panel {
      padding: 15px;
      width: 100%;
      border-bottom: 2px solid #444;
      text-align: right;
      box-sizing: border-box;
    }
    .stat-row {
      font-size: 18px;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    .balance-val { color: #ffd700; font-weight: bold; }
    .bet-val { color: #ff4500; font-weight: bold; }

    /* Зона полета (арена) */
    #arena {
      flex-grow: 1;
      width: 90%;
      background: #333;
      border: 2px dashed #555;
      position: relative;
      overflow: hidden;
      margin-top: 10px;
    }

    /* Пиксельный бык (CSS Sprite) */
    #bull {
      position: absolute;
      bottom: 10px;
      left: 20px;
      width: 32px;
      height: 32px;
      /* Рисуем быка через CSS градиенты и тени для пиксель-арта */
      background: 
        radial-gradient(circle, #fff 2px, transparent 2px) 0 0,
        radial-gradient(circle, #fff 2px, transparent 2px) 8px 0,
        radial-gradient(circle, #fff 2px, transparent 2px) 16px 0,
        radial-gradient(circle, #fff 2px, transparent 2px) 24px 0,
        
        radial-gradient(circle, #fff 2px, transparent 2px) 0 8px,
        radial-gradient(circle, #ff4500 2px, transparent 2px) 8px 8px, /* Пятно */
        radial-gradient(circle, #fff 2px, transparent 2px) 16px 8px,
        radial-gradient(circle, #fff 2px, transparent 2px) 24px 8px,

        radial-gradient(circle, #fff 2px, transparent 2px) 0 16px,
        radial-gradient(circle, #fff 2px, transparent 2px) 8px 16px,
        radial-gradient(circle, #fff 2px, transparent 2px) 16px 16px,
        radial-gradient(circle, #fff 2px, transparent 2px) 24px 16px,

        radial-gradient(circle, #fff 2px, transparent 2px) 0 24px,
        radial-gradient(circle, #fff 2px, transparent 2px) 8px 24px,
        radial-gradient(circle, #fff 2px, transparent 2px) 16px 24px,
        radial-gradient(circle, #fff 2px, transparent 2px) 24px 24px;
        
      background-size: 32px 32px;
      filter: drop-shadow(0 0 5px #ff4500);
      transform-origin: bottom center;
      animation: bounce 0.5s infinite alternate;
    }

    @keyframes bounce {
      from { transform: scaleY(1); }
      to { transform: scaleY(0.9); }
    }

    /* Линия старта */
    .start-line {
      position: absolute;
      bottom: 0; left: 20px; right: 0;
      height: 2px;
      background: red;
    }

    /* Большой множитель */
    #multiplier-display {
      font-size: 60px;
      font-weight: bold;
      color: #ffd700;
      text-shadow: 2px 2px 0 #000;
      margin-top: 20px;
      line-height: 1;
    }

    /* Кнопки */
    .controls {
      width: 80%;
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    button {
      flex: 1;
      padding: 15px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 16px;
      text-transform: uppercase;
      transition: 0.2s;
    }
    .btn-bet { background: #444; color: white; }
    .btn-cashout { background: #ffd700; color: black; font-weight: bold; }
    .btn-crash { background: #ff4500; color: white; }

    button:hover { transform: scale(1.05); }

    /* Статус игры */
    #status-msg {
      margin-top: 10px;
      font-size: 14px;
      min-height: 20px;
    }
    .win { color: green; }
    .loss { color: red; }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="top-panel">
      <div class="stat-row">Баланс: <span id="balance" class="balance-val">1000</span> ★</div>
      <div class="stat-row">Ставка: <span id="current-bet" class="bet-val">0</span> ★</div>
    </div>

    <div id="arena">
      <div class="start-line"></div>
      <div id="bull"></div>
    </div>

    <div id="multiplier-display">x1.00</div>
    
    <div class="controls">
      <button class="btn-bet" onclick="placeBet()">СТАВИТЬ</button>
      <button class="btn-cashout" onclick="cashOut()" id="btn-cashout" disabled>ЗАБРАТЬ</button>
    </div>

    <div id="status-msg"></div>
  </div>

  <script>
    // --- Переменные состояния ---
    let balance = 1000;
    let currentBet = 0;
    let isPlaying = false;
    let multiplier = 1.00;
    let animationFrameId;
    
    // Элементы DOM
    const elBalance = document.getElementById('balance');
    const elBet = document.getElementById('current-bet');
    const elMulti = document.getElementById('multiplier-display');
    const elBull = document.getElementById('bull');
    const btnCashout = document.getElementById('btn-cashout');
    const statusMsg = document.getElementById('status-msg');

    // Обновление UI
    function updateUI() {
      elBalance.textContent = balance;
      elBet.textContent = currentBet;
    }

    function setStatus(text, colorClass) {
      statusMsg.textContent = text;
      statusMsg.className = 'status-msg ' + (colorClass || '');
    }

    // --- Логика игры ---

    // 1. Поставить ставку
    function placeBet() {
      if (isPlaying) return;

      const input = prompt("Введите сумму ставки (минимум 1):");
      const bet = parseInt(input);

      if (!bet || bet < 1) {
        alert("Некорректная ставка!");
        return;
      }
      if (bet > balance) {
        alert("Недостаточно средств!");
        return;
      }

      // Списываем баланс
      balance -= bet;
      currentBet = bet;
      updateUI();

      // Старт игры
      isPlaying = true;
      multiplier = 1.00;
      elMulti.textContent = "x1.00";
      
      // Сброс позиции быка
      elBull.style.left = "20px";
      btnCashout.disabled = false;
      setStatus("Игра началась! Бык мчится...", "");
      
      startGameLoop();
    }

    // 2. Забрать выигрыш
    function cashOut() {
      if (!isPlaying) return;
      
      const winnings = currentBet * multiplier;
      balance += winnings;
      updateUI();
      
      stopGame(true, winnings);
    }

    // 3. Запуск цикла анимации и рандома
    function startGameLoop() {
      const startTime = Date.now();

      function animate() {
        if (!isPlaying) return;

        const elapsed = (Date.now() - startTime) / 1000; // секунды
        
        // Расчет множителя: растет линейно
        multiplier = 1 + (elapsed * 0.4); // +0.4 каждую секунду
        elMulti.textContent = "x" + multiplier.toFixed(2);

        // --- ЧЕСТНАЯ СИСТЕМА РАНДОМА ---
        // Вероятность краша растет со временем.
        // Формула: P = 1 - e^(-k * t). Чем дольше игра, тем выше шанс.
        const crashChance = 1 - Math.exp(-0.8 * elapsed); 
        
        if (Math.random() < crashChance) {
          crashGame();
          return;
        }

        // Движение быка (простая линейная интерполяция до конца арены)
        const arenaWidth = document.getElementById('arena').offsetWidth;
        const bullWidth = 32;
        const maxLeft = arenaWidth - bullWidth - 20;
        
        // Бык доезжает за ~5 секунд (подстроено под скорость роста множителя)
        const progress = Math.min(elapsed / 5, 1); 
        const newLeft = 20 + (maxLeft * progress);
        
        elBull.style.left = newLeft + "px";

        animationFrameId = requestAnimationFrame(animate);
      }
      animate();
    }

    // Остановка игры
    function stopGame(won, amount) {
      isPlaying = false;
      cancelAnimationFrame(animationFrameId);
      btnCashout.disabled = true;
      
      if (won) {
        setStatus(`ПОБЕДА! Вы выиграли ${amount.toFixed(0)} ★`, "win");
      } else {
        setStatus("CRASH! Ставка сгорела.", "loss");
      }
    }

    // Обработка краша
    function crashGame() {
      // Бык врезается в стену (анимация удара)
      elBull.style.transform = "rotate(45deg) scale(0.8)";
      elBull.style.filter = "drop-shadow(0 0 10px red)";

      stopGame(false, 0);
    }

    // Инициализация
    updateUI();
  </script>
</body>
</html>

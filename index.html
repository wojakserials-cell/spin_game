<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VIRUS CRASH: RODEO EDITION</title>
  <!-- Библиотека для работы с Telegram (делает кнопки родными) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #050505;
      --acid-green: #00ff41; /* Фирменный цвет Virus Game */
      --neon-yellow: #ffff00;
      --panel-bg: #0a0a0a;
      --border-glow: 0 0 15px rgba(0, 255, 65, 0.5);
      --text-color: #ffffff;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Courier New', Courier, monospace; /* Пиксельный шрифт */
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* --- ГЛАВНЫЙ ЭКРАН --- */
    .app-container {
      width: 100%;
      max-width: 420px;
      height: 90vh;
      background: var(--panel-bg);
      border: 2px solid #333;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 20px;
    }

    /* Верхняя панель: Баланс + Инвентарь */
    .top-bar {
      width: 100%;
      padding: 15px 20px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
    }
    .balance-box {
      font-size: 18px;
      text-transform: uppercase;
      color: var(--acid-green);
      font-weight: bold;
      text-shadow: 0 0 5px var(--acid-green);
    }
    .star-icon {
      display: inline-block;
      width: 12px; height: 12px;
      background: #fff;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      vertical-align: middle;
    }
    
    .inv-btn {
      background: transparent;
      border: 1px solid var(--acid-green);
      color: var(--acid-green);
      padding: 8px 16px;
      font-family: inherit;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 14px;
      transition: 0.2s;
    }
    .inv-btn:hover {
      background: var(--acid-green);
      color: black;
      box-shadow: var(--border-glow);
    }

    /* --- ЗОНА ИГРЫ --- */
    #game-zone {
      flex-grow: 1;
      width: 90%;
      background: #000;
      border: 2px dashed #444;
      position: relative;
      overflow: hidden;
      margin-top: 10px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
    }

    /* Пиксельный бык (CSS Art) */
    .bull-sprite {
      position: absolute;
      bottom: 4px;
      left: 20px;
      width: 32px;
      height: 32px;
      /* Рисуем быка из квадратов */
      background-image: 
        linear-gradient(#00ff41, #00ff41), /* Тело */
        linear-gradient(#fff, #fff),       /* Рог 1 */
        linear-gradient(#fff, #fff);       /* Рог 2 */
      background-size: 16px 16px, 8px 8px, 8px 8px;
      background-position: 0 0, 0 -8px, 16px -8px;
      filter: drop-shadow(0 0 8px var(--acid-green));
      transform-origin: bottom center;
      animation: idleShake 0.3s infinite alternate;
    }

    @keyframes idleShake {
      from { transform: scaleY(1); }
      to { transform: scaleY(0.95); }
    }

    .start-line {
      position: absolute;
      bottom: 0; left: 20px; right: 0;
      height: 4px;
      background: var(--acid-green);
      box-shadow: 0 0 10px var(--acid-green);
    }

    /* Большой множитель */
    #multiplier-display {
      font-size: 60px;
      font-weight: bold;
      color: var(--neon-yellow);
      text-shadow: 2px 2px 0 #000, 0 0 10px var(--neon-yellow);
      margin-top: 10px;
      line-height: 1;
      z-index: 10;
      pointer-events: none;
    }

    /* Кнопки управления */
    .controls {
      width: 90%;
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    button.game-btn {
      flex: 1;
      padding: 15px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 16px;
      text-transform: uppercase;
      font-weight: bold;
      transition: 0.2s;
    }
    .btn-bet { 
      background: #222; 
      color: white; 
      border: 2px solid var(--acid-green);
    }
    .btn-cashout { 
      background: var(--neon-yellow); 
      color: black; 
    }
    .btn-disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }

    button:active { transform: scale(0.98); }

    #status-msg {
      margin-top: 10px;
      min-height: 24px;
      text-align: center;
      font-weight: bold;
      text-shadow: 0 0 5px black;
    }
    .win-msg { color: #0f0; }
    .loss-msg { color: red; text-shadow: 0 0 10px red; }

    /* --- ИНВЕНТАРЬ (ПОП-АП) --- */
    #inventory-modal {
      display: none; /* Скрыт по умолчанию */
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .inv-header {
      font-size: 28px;
      color: var(--acid-green);
      margin-bottom: 20px;
      text-shadow: 0 0 10px var(--acid-green);
    }
    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 300px;
      width: 100%;
    }
    .item-card {
      background: #111;
      border: 1px solid #444;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .item-img {
      width: 40px; height: 40px;
      background: linear-gradient(45deg, #00ff41 25%, transparent 25%) 0 0,
                  linear-gradient(45deg, transparent 75%, #00ff41 75%) 0 0,
                  linear-gradient(45deg, transparent 75%, #00ff41 75%) -18px 18px,
                  linear-gradient(45deg, #00ff41 25%, transparent 25%) 18px -18px;
      background-size: 40px 40px;
      background-repeat: no-repeat;
      filter: drop-shadow(0 0 5px var(--acid-green));
    }
    .sell-btn {
      margin-top: 5px;
      background: transparent;
      border: 1px solid red;
      color: red;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .close-inv {
      margin-top: 20px;
      padding: 10px 30px;
      background: #333;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Основной интерфейс -->
  <div class="app-container">
    <div class="top-bar">
      <div class="balance-box">Баланс: <span id="balance-display">1000</span> <span class="star-icon"></span></div>
      <button class="inv-btn" onclick="toggleInventory()">ИНВЕНТАРЬ</button>
    </div>

    <div id="game-zone">
      <div class="start-line"></div>
      <div class="bull-sprite" id="bull"></div>
    </div>

    <div id="multiplier-display">x1.00</div>

    <div class="controls">
      <button class="game-btn btn-bet" onclick="startGame()">СТАВИТЬ</button>
      <button class="game-btn btn-cashout" onclick="cashOut()" id="cashout-btn" disabled>ЗАБРАТЬ</button>
    </div>

    <div id="status-msg"></div>
  </div>

  <!-- Окно инвентаря -->
  <div id="inventory-modal">
    <div class="inv-header">МОЙ ИНВЕНТАРЬ</div>
    <div class="inventory-grid">
      <!-- Предмет 1 -->
      <div class="item-card">
        <div class="item-img"></div>
        <span>Золотой бык</span>
        <span style="color:#aaa; font-size:12px;">x1</span>
        <button class="sell-btn" onclick="sellItem(500)">ПРОДАТЬ (500★)</button>
      </div>
      <!-- Предмет 2 -->
      <div class="item-card">
        <div class="item-img" style="filter: sepia(1) hue-rotate(90deg)"></div>
        <span>Редкий бык</span>
        <span style="color:#aaa; font-size:12px;">x2</span>
        <button class="sell-btn" onclick="sellItem(1000)">ПРОДАТЬ (1000★)</button>
      </div>
      <!-- Пустой слот -->
      <div class="item-card" style="opacity:0.3; border: 1px dashed #555;">
        <span style="color:#555">Пусто</span>
      </div>
      <!-- Предмет 3 -->
      <div class="item-card">
        <div class="item-img" style="background-color:#ffd700"></div>
        <span>Монета</span>
        <span style="color:#aaa; font-size:12px;">x5</span>
        <button class="sell-btn" onclick="sellItem(50)">ПРОДАТЬ (50★)</button>
      </div>
      <!-- Пустые -->
      <div class="item-card" style="opacity:0.3; border: 1px dashed #555;"><span style="color:#555">Пусто</span></div>
      <div class="item-card" style="opacity:0.3; border: 1px dashed #555;"><span style="color:#555">Пусто</span></div>
    </div>
    <button class="close-inv" onclick="toggleInventory()">ЗАКРЫТЬ</button>
  </div>

  <script>
    // Инициализация Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // Раскрыть на весь экран

    // --- Переменные ---
    let balance = 1000;
    let currentBet = 0;
    let isPlaying = false;
    let multiplier = 1.00;
    let animationId;
    
    // Элементы
    const elBalance = document.getElementById('balance-display');
    const elMulti = document.getElementById('multiplier-display');
    const elBull = document.getElementById('bull');
    const btnCashout = document.getElementById('cashout-btn');
    const statusMsg = document.getElementById('status-msg');
    const invModal = document.getElementById('inventory-modal');

    function updateUI() { elBalance.textContent = balance; }
    function setStatus(text, className) {
      statusMsg.textContent = text;
      statusMsg.className = 'status-msg ' + (className || '');
    }

    // --- УПРАВЛЕНИЕ ИНВЕНТАРЁМ ---
    function toggleInventory() {
      invModal.style.display = invModal.style.display === 'flex' ? 'none' : 'flex';
    }
    function sellItem(amount) {
      balance += amount;
      updateUI();
      setStatus(`Продано! Получено ${amount} ★`, 'win-msg');
      // Здесь можно добавить удаление предмета из сетки, но для демо просто начисляем деньги
      setTimeout(() => setStatus('', ''), 2000);
    }

    // --- ЛОГИКА ИГРЫ ---
    function startGame() {
      if (isPlaying) return;

      const input = prompt("Введите сумму ставки (минимум 1):");
      const bet = parseInt(input);

      if (!bet || bet < 1) { alert("Некорректная ставка!"); return; }
      if (bet > balance)

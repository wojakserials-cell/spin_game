<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { background: #fff; color: #000; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    #game { position: relative; width: 320px; height: 480px; border: 2px solid #ccc; background: #fff; overflow: hidden; }
    .btn { padding: 12px 24px; font-size: 16px; cursor: pointer; border: none; margin-top: 10px; }
    #crash-btn { background: #ff4d4d; color: white; }
    #bet-btn { background: #333; color: white; }
    #cashout-btn { background: #28a745; color: white; display: none; }
    #status { text-align: center; margin-bottom: 10px; font-weight: bold; }
    #multiplier { font-size: 24px; color: #007bff; }
    .rocket { position: absolute; left: 140px; bottom: 10px; width: 40px; height: 60px; background: linear-gradient(#fff, #ddd); border-radius: 5px; box-shadow: 0 0 10px rgba(255,100,100,0.5); transition: bottom 0.05s linear; }
    .explosion { position: absolute; width: 60px; height: 60px; background: radial-gradient(circle, #ff0000 0%, #ffaa00 20%, transparent 50%); border-radius: 50%; transform: translate(-50%,-50%); pointer-events: none; animation: pop 0.4s forwards; }
    @keyframes pop { 0% { transform: translate(-50%,-50%) scale(1); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(2.5); opacity: 0; } }
  </style>
</head>
<body>
  <div id="game">
    <div id="status">Баланс: <span id="balance">1000</span> ₽</div>
    <div id="multiplier">x1.00</div>
    <div class="rocket" id="rocket"></div>
    <button id="crash-btn" class="btn">Краш</button>
    <button id="bet-btn" class="btn">Принять ставку</button>
    <button id="cashout-btn" class="btn">Забрать</button>
  </div>

  <script>
    const balanceEl = document.getElementById('balance');
    const multEl = document.getElementById('multiplier');
    const rocket = document.getElementById('rocket');
    const crashBtn = document.getElementById('crash-btn');
    const betBtn = document.getElementById('bet-btn');
    const cashoutBtn = document.getElementById('cashout-btn');

    let balance = 1000;
    let bet = 0;
    let multiplier = 1.00;
    let isRunning = false;
    let crashAt = 0;
    let rocketPos = 10; // px от низа
    let speed = 4; // px за кадр
    let frameId;

    function startGame() {
      if (!isRunning && bet > 0) {
        isRunning = true;
        crashAt = (Math.random() * 3 + 1).toFixed(1); // краш между 1.1 и 4.0
        rocketPos = 10;
        multiplier = 1.00;
        multEl.textContent = 'x' + multiplier.toFixed(2);
        cashoutBtn.style.display = 'block';
        crashBtn.disabled = true;
        betBtn.disabled = true;
        animateRocket();
      }
    }

    function animateRocket() {
      rocketPos += speed;
      rocket.style.bottom = rocketPos + 'px';

      // рост множителя
      multiplier += 0.1;
      multEl.textContent = 'x' + multiplier.toFixed(1);

      // проверка краша
      if (multiplier >= crashAt) {
        stopGame(true);
      } else {
        frameId = requestAnimationFrame(animateRocket);
      }
      
      // ограничение высоты
      if (rocketPos >= 450) {
        // если долетел до верха без краша — считаем, что краш был на максимуме
        stopGame(false);
      }
    }

    function stopGame(crashed) {
      cancelAnimationFrame(frameId);
      isRunning = false;
      crashBtn.disabled = false;
      betBtn.disabled = false;
      cashoutBtn.style.display = 'none';

      if (crashed) {
        // проигрыш
        balance -= bet;
        balanceEl.textContent = balance.toFixed(0);
        createExplosion(rocket.offsetLeft + 20, rocket.offsetTop + 30);
        rocket.style.bottom = '10px';
      } else {
        // долетел до верха — выигрыш по текущему множителю (или макс)
        const win = bet

<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; overflow: hidden; }

    /* ЭКРАН 1: ГЛАВНАЯ */
    #start-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #2b1a3e 0%, #4a2a6a 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; transition: opacity 0.3s;
    }
    .start-title { font-size: 32px; font-weight: bold; margin-bottom: 40px; text-shadow: 0 0 15px rgba(255,255,255,0.4); }
    .crash-btn-main {
      padding: 20px 40px; font-size: 24px; font-weight: bold;
      background: #fff; color: #2b1a3e; border: none; border-radius: 50px;
      cursor: pointer; box-shadow: 0 0 25px rgba(255,255,255,0.4);
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .crash-btn-main:hover { transform: scale(1.05); box-shadow: 0 0 40px rgba(255,255,255,0.6); }

    /* ЭКРАН 2: ИГРА */
    #game-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #fff; display: none; flex-direction: column; align-items: center; justify-content: center;
    }
    #game {
      position: relative; width: 320px; height: 480px;
      border: 2px solid #ddd; background: #fff; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    }
    .btn {
      padding: 12px 24px; font-size: 16px; cursor: pointer; border: none; margin-top: 8px;
      border-radius: 8px; transition: transform 0.05s;
    }
    .btn:active { transform: scale(0.96); }
    #crash-btn { background: #ff4d4d; color: white; }
    #bet-btn { background: #333; color: white; }
    #cashout-btn { background: #28a745; color: white; display: none; }
    #status { text-align: center; margin-bottom: 10px; font-weight: bold; color: #333; }
    #multiplier { font-size: 28px; color: #007bff; font-weight: bold; }
    
    /* Поле ввода ставки */
    #bet-input {
      width: 100%; padding: 12px; margin-top: 10px; border: 1px solid #ccc; border-radius: 8px;
      font-size: 16px; box-sizing: border-box; text-align: right;
    }

    .rocket {
      position: absolute; left: 140px; bottom: 10px; width: 40px; height: 60px;
      background: linear-gradient(#fff, #ddd); border-radius: 6px;
      box-shadow: 0 0 10px rgba(255,100,100,0.5); transition: bottom 0.05s linear;
    }
    .explosion {
      position: absolute; width: 60px; height: 60px; border-radius: 50%;
      pointer-events: none; animation: pop 0.4s forwards;
    }
    @keyframes pop {
      0% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%,-50%) scale(2.5); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- ЭКРАН 1 -->
  <div id="start-screen">
    <div class="start-title">Spin Game</div>
    <button id="enter-btn" class="crash-btn-main">Краш</button>
  </div>

  <!-- ЭКРАН 2 -->
  <div id="game-screen">
    <div id="game">
      <div id="status">Баланс: <span id="balance">1000</span> ₽</div>
      <div id="multiplier">x1.00</div>
      
      <!-- Поле ввода ставки -->
      <input type="number" id="bet-input" placeholder="Сумма ставки" min="1">
      
      <button id="bet-btn" class="btn">Принять ставку</button>
      <button id="cashout-btn" class="btn">Забрать</button>
      <button id="crash-btn" class="btn" style="display:none;">Краш</button>
      
      <div class="rocket" id="rocket"></div>
    </div>
  </div>

  <script>
    const startScreen = document.getElementById('start-screen');
    const gameScreen = document.getElementById('game-screen');
    const enterBtn = document.getElementById('enter-btn');

    const balanceEl = document.getElementById('balance');
    const multEl = document.getElementById('multiplier');
    const betInput = document.getElementById('bet-input');
    const rocket = document.getElementById('rocket');
    const crashBtn = document.getElementById('crash-btn');
    const betBtn = document.getElementById('bet-btn');
    const cashoutBtn = document.getElementById('cashout-btn');

    let balance = 1000;
    let bet = 0;
    let multiplier = 1.00;
    let isRunning = false;
    let rocketPos = 10;
    let speed = 4;
    let frameId;

    // Переход на игру
    enterBtn.onclick = () => {
      startScreen.style.display = 'none';
      gameScreen.style.display = 'flex';
    };

    function startGame() {
      if (!isRunning && bet > 0) {
        isRunning = true;
        rocketPos = 10;
        multiplier = 1.00;
        multEl.textContent = 'x' + multiplier.toFixed(2);
        cashoutBtn.style.display = 'block';
        betBtn.style.display = 'none'; // скрываем «Принять ставку»
        betInput.disabled = true;      // блокируем ввод во время игры
        crashBtn.style.display = 'none';
        animateRocket();
      }
    }

    function animateRocket() {
      rocketPos += speed;
      rocket.style.bottom = rocketPos + 'px';

      multiplier += 0.1;
      multEl.textContent = 'x' + multiplier.toFixed(1);

      // Логика шансов краша
      const chance = Math.random(); // число от 0 до 1
      let crashHappens = false;

      if (multiplier <= 3.0) {
        // До 3.0 — краш в 30% случаев
        if (chance < 0.30) crashHappens = true;
      } else {
        // Выше 3.0 — краш в 20% случаев
        if (chance < 0.20) crashHappens = true;
      }

      if (crashHappens) {
        stopGame(true);
      } else if (rocketPos >= 450) {
        // Если долетел до верха без краша — победа
        stopGame(false);
      } else {
        frameId = requestAnimationFrame(animateRocket);
      }
    }

    function stopGame(crashed) {
      cancelAnimationFrame(frameId);
      isRunning = false;
      cashoutBtn.style.display = 'none';
      betBtn.style.display = 'block';
      betInput.disabled = false;
      betInput.value = '';

      if (crashed) {
        balance -= bet;
        balanceEl.textContent = balance.toFixed(0);
        createExplosion(rocket.offsetLeft + 20, rocket.offsetTop + 30);
        rocket.style.bottom = '10px';
      } else {
        const win = bet * multiplier;
        balance += win;
        balanceEl.textContent = balance.toFixed(0);
      }
      bet = 0;
      multEl.textContent = 'x1.00';
    }

    function createExplosion(x, y) {
      const el = document.createElement('div');
      el.className = 'explosion';
      el.style.background = 'radial-gradient(circle, #ff0000 0%, #ffaa00 20%, transparent 50%)';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      document.getElementById('game').appendChild(el);
      setTimeout(() => el.remove(), 400);
    }

    betBtn.onclick = () => {
      const inputValue = parseFloat(betInput.value);
      if (!inputValue || inputValue <= 0) {
        alert('Введите корректную сумму');
        return;
      }
      if (balance >= inputValue) {
        bet = inputValue;
        balance -= bet;
        balanceEl.textContent = balance.toFixed(0);
        startGame();
      } else {
        alert('Недостаточно средств');
      }
    };

    cashoutBtn.onclick = () => {
      if (isRunning) {
        const win = bet * multiplier;
        balance += win;
        balanceEl.textContent = balance.toFixed(0);
        stopGame(false);
      }
    };
  </script>
</body>
</html>
